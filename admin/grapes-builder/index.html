<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CeyBreez Live Visual Builder</title>
  <link rel="stylesheet" href="builder.css">
</head>
<body>
<header class="cb-topbar">
  <div class="cb-brand"><a href="../" class="cb-back">←</a><div><strong>CeyBreez Live Visual Builder</strong><small>Actual live page editor</small></div></div>
  <div class="cb-tools">
    <label>Page <select id="pageSelect">
      <option value="welcome">Welcome Screen</option><option value="home" selected>Home Page</option>
      <option value="villas.html">Villas</option><option value="apartments.html">Apartments</option><option value="homestays.html">Homestays</option>
      <option value="tours.html">Tours</option><option value="tour-details.html">Tour Details</option><option value="services.html">Services</option>
      <option value="contact.html">Contact</option><option value="privacy.html">Privacy</option><option value="terms.html">Terms</option>
    </select></label>
    <button id="reloadBtn">Reload page</button><button id="undoBtn">Undo</button><button id="saveBtn" class="primary">Save draft</button><button id="clearBtn">Clear draft</button>
  </div>
</header>
<div id="status" class="cb-status">Loading Home Page…</div>
<main class="cb-shell">
  <aside class="cb-left">
    <h3>Page sections</h3><div id="sectionList" class="section-list"></div>
    <div class="tip"><b>How to edit</b><br>Click an element on the page. Double-click text to type directly. Use the right panel for styling.</div>
  </aside>
  <section class="cb-workspace">
    <div class="cb-devicebar"><button data-width="100%" class="active">Desktop</button><button data-width="768px">Tablet</button><button data-width="390px">Mobile</button><span id="selectedLabel">Nothing selected</span></div>
    <div class="cb-stage"><iframe id="liveFrame" title="CeyBreez live page"></iframe></div>
  </section>
  <aside class="cb-right">
    <h3>Selected element</h3><div id="emptyState" class="empty">Click an element inside the page.</div>
    <div id="inspector" hidden>
      <label>Element<input id="elementName" readonly></label>
      <label>Text<textarea id="textValue" rows="4"></textarea></label>
      <label id="linkRow">Link URL<input id="linkValue" type="text"></label>
      <label id="imageRow">Image URL<div class="inline"><input id="imageValue" type="text"><button id="uploadBtn">Upload</button></div></label>
      <div class="two"><label>Text colour<input id="colorValue" type="color"></label><label>Background<input id="bgValue" type="color"></label></div>
      <div class="two"><label>Font size<input id="fontSize" type="number" min="8" max="120"></label><label>Radius<input id="radius" type="number" min="0" max="100"></label></div>
      <div class="two"><label>Padding<input id="padding" type="number" min="0" max="200"></label><label>Margin<input id="margin" type="number" min="0" max="200"></label></div>
      <label>Text align<select id="textAlign"><option value="">Default</option><option>left</option><option>center</option><option>right</option></select></label>
      <div class="actions"><button id="hideBtn">Hide / Show</button><button id="resetElementBtn">Reset element</button></div>
    </div>
  </aside>
</main>
<input id="fileInput" type="file" accept="image/*" hidden>
<script src="builder.js"></script>
</body></html>
