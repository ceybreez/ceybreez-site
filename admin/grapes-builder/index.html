<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CeyBreez GrapesJS Builder Trial</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.23.2/dist/css/grapes.min.css" />
  <link rel="stylesheet" href="builder.css" />
</head>
<body>
  <header class="cb-topbar">
    <div class="cb-brand"><strong>CeyBreez</strong><span>GrapesJS Builder Trial</span></div>
    <div class="cb-actions">
      <button id="loadHome" type="button">Reload Home</button>
      <button id="desktop" type="button">Desktop</button>
      <button id="tablet" type="button">Tablet</button>
      <button id="mobile" type="button">Mobile</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="preview" type="button">Preview</button>
      <button id="save" class="primary" type="button">Save Draft</button>
      <button id="export" class="primary" type="button">Export HTML</button>
    </div>
  </header>
  <div id="status" class="cb-status">Loading builder…</div>
  <main class="cb-layout">
    <aside class="cb-sidebar">
      <h3>Elements</h3>
      <div id="blocks"></div>
      <h3>Layers</h3>
      <div id="layers"></div>
    </aside>
    <section class="cb-editor"><div id="gjs"></div></section>
    <aside class="cb-inspector">
      <div class="panel-tabs">
        <button data-tab="styles" class="active">Style</button>
        <button data-tab="traits">Settings</button>
      </div>
      <div id="styles" class="panel-body"></div>
      <div id="traits" class="panel-body hidden"></div>
    </aside>
  </main>
  <input id="assetInput" type="file" accept="image/*" multiple hidden />
  <script src="https://unpkg.com/grapesjs@0.23.2"></script>
  <script src="builder.js"></script>
</body>
</html>
